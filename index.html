<!DOCTYPE html>
<html lang="en">
<head>
<!-- VERSION: v1-atelier -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a1a1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Atelier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#1a1a1a; --surface:#1e1e1e; --elevated:#232323;
  --text:#ededed; --dim:#888; --faint:#4e4e4e; --line:#2e2e2e;
  --gold:#c9a84c; --teal:#7fb3a8; --purple:#9d8bb5; --error:#c87b6e;
  --accent:#c9a84c;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  background:var(--bg);color:var(--text);
  font-family:'DM Mono',monospace;font-size:14px;
  padding-top:var(--safe-top);padding-bottom:var(--safe-bottom);
  -webkit-font-smoothing:antialiased;
}
.screen{display:none;}
.screen.active{display:block;}

/* ── LOADING ── */
#screen-loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:20px;}
#screen-loading.active{display:flex;}
.ld-eye{font-size:10px;letter-spacing:4px;text-transform:uppercase;color:var(--faint);}
.ld-title{font-family:'Playfair Display',serif;font-style:italic;font-size:30px;color:var(--gold);}
.ld-bar{width:120px;height:1px;background:var(--line);position:relative;overflow:hidden;}
.ld-bar::after{content:'';position:absolute;left:-100%;top:0;width:100%;height:100%;background:var(--gold);animation:lbar 1.4s ease-in-out infinite;}
@keyframes lbar{0%{left:-100%}100%{left:100%}}
#ld-status{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--dim);}

/* ── CALENDAR ── */
#screen-calendar{padding-bottom:48px;}
.cal-header{padding:20px 20px 16px;border-bottom:1px solid var(--line);}
.monogram{font-family:'Playfair Display',serif;font-size:11px;color:var(--gold);letter-spacing:4px;text-transform:uppercase;margin-bottom:4px;}
.app-title{font-family:'Playfair Display',serif;font-style:italic;font-size:26px;color:var(--text);line-height:1;}
.app-sub{font-size:10px;color:var(--dim);letter-spacing:3px;text-transform:uppercase;margin-top:4px;}

.today-card{margin:16px 20px;border:1px solid var(--line);border-left-width:3px;background:var(--surface);padding:14px 16px;cursor:pointer;}
.today-card:active{background:var(--elevated);}
.today-eye{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--dim);margin-bottom:5px;}
.today-type{font-family:'Playfair Display',serif;font-style:italic;font-size:22px;line-height:1.1;}
.today-date{font-size:10px;color:var(--dim);margin-top:4px;letter-spacing:1px;}
.today-tap{font-size:9px;letter-spacing:2px;text-transform:uppercase;margin-top:10px;}

.stats-row{display:grid;grid-template-columns:1fr 1fr 1fr;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 20px 20px;}
.stat-cell{padding:12px 0;text-align:center;border-right:1px solid var(--line);}
.stat-cell:last-child{border-right:none;}
.stat-val{font-family:'Playfair Display',serif;font-size:22px;}
.stat-lbl{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);margin-top:2px;}

.month-nav{display:flex;align-items:center;justify-content:space-between;padding:0 20px 12px;}
.mnav-btn{background:none;border:none;color:var(--dim);font-size:20px;cursor:pointer;padding:4px 8px;line-height:1;font-family:'DM Mono',monospace;}
.mnav-btn:active{color:var(--text);}
.month-lbl{font-family:'Playfair Display',serif;font-size:15px;letter-spacing:1px;}

.cal-wrap{padding:0 20px;}
.dow-row{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:6px;}
.dow{text-align:center;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--faint);padding:4px 0;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.cal-cell{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:1px solid transparent;}
.cal-cell.tappable{cursor:pointer;}
.cal-cell.is-today{border-color:var(--gold);}
.cal-num{font-family:'DM Mono',monospace;font-size:12px;color:var(--dim);line-height:1;}
.cal-cell.is-today .cal-num{color:var(--gold);}
.cal-dot{width:4px;height:4px;border-radius:50%;}

.legend{display:flex;gap:14px;padding:16px 20px 0;flex-wrap:wrap;}
.leg-item{display:flex;align-items:center;gap:6px;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);}
.leg-dot{width:6px;height:6px;border-radius:50%;}

/* ── WORKOUT ── */
#screen-workout{padding-bottom:40px;}
.wo-header{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:12px;}
.back-btn{background:none;border:none;color:var(--dim);font-size:20px;cursor:pointer;padding:0;margin-top:4px;line-height:1;font-family:'DM Mono',monospace;}
.back-btn:active{color:var(--text);}
.wo-header-text{flex:1;}
.wo-date-lbl{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--dim);margin-bottom:2px;}
.wo-session-eye{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--dim);}
.wo-type{font-family:'Playfair Display',serif;font-style:italic;font-size:24px;line-height:1.1;}

.vol-card{margin:16px 20px;border:1px solid var(--line);border-left-width:3px;background:var(--surface);padding:14px 16px;}
.vol-eye{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--dim);margin-bottom:8px;}
.vol-today-num{font-family:'Playfair Display',serif;font-size:28px;line-height:1;}
.vol-bar-wrap{margin:10px 0 6px;height:3px;background:var(--line);position:relative;}
.vol-bar-fill{height:100%;transition:width 0.3s ease;position:absolute;top:0;left:0;}
.vol-bar-marker{position:absolute;top:-4px;width:1px;height:11px;background:var(--dim);}
.vol-sub{font-size:10px;color:var(--dim);letter-spacing:1px;}

.ex-groups{padding:0 20px;}
.group-hdr{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--dim);padding:16px 0 8px;border-bottom:1px solid var(--line);margin-bottom:8px;}
.ex-card{background:var(--surface);border:1px solid var(--line);margin-bottom:8px;padding:12px 12px 0;}
.ex-name{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--text);margin-bottom:10px;}
.sets-tbl{width:100%;border-collapse:collapse;}
.sets-tbl th{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--faint);font-weight:400;padding:0 0 6px;text-align:left;}
.sets-tbl td{padding:3px 0;}
.set-num{font-size:11px;color:var(--faint);width:22px;}
.set-input{
  background:var(--elevated);border:1px solid var(--line);
  color:var(--text);font-family:'DM Mono',monospace;font-size:14px;
  padding:7px 6px;width:64px;text-align:center;
  -webkit-appearance:none;appearance:none;border-radius:0;
}
.set-input:focus{outline:none;border-color:var(--accent);}
.set-input.pr{border-color:var(--gold);color:var(--gold);}
.set-x{font-size:10px;color:var(--faint);text-align:center;padding:0 4px;}
.set-last{font-size:11px;color:var(--faint);text-align:right;padding-left:8px;}
.sets-divider{height:1px;background:var(--line);margin:10px -12px 0;}

.finish-wrap{padding:24px 20px 8px;}
.finish-btn{
  display:block;width:100%;padding:16px;
  background:var(--gold);color:#1a1a1a;border:none;
  font-family:'DM Mono',monospace;font-size:11px;
  letter-spacing:3px;text-transform:uppercase;
  cursor:pointer;font-weight:500;
  box-shadow:0 0 24px rgba(201,168,76,0.18);
}
.finish-btn:active{opacity:0.85;}

/* ── DONE ── */
#screen-done{padding:0 20px 48px;}
.done-hdr{padding:32px 0 24px;border-bottom:1px solid var(--line);margin-bottom:24px;}
.done-diamond{font-size:22px;color:var(--gold);margin-bottom:8px;}
.done-eye{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--dim);margin-bottom:6px;}
.done-type{font-family:'Playfair Display',serif;font-style:italic;font-size:28px;}
.done-vol{font-family:'Playfair Display',serif;font-size:42px;line-height:1;margin-bottom:4px;}
.done-vol-lbl{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);}
.done-delta{font-size:12px;color:var(--dim);margin-top:6px;}
.done-delta.up{color:var(--teal);}
.done-delta.dn{color:var(--error);}
.pr-card{border:1px solid var(--gold);background:var(--surface);padding:14px 16px;margin:24px 0;}
.pr-eye{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);margin-bottom:10px;}
.pr-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--line);}
.pr-row:last-child{border-bottom:none;}
.pr-name{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--text);}
.pr-val{font-size:13px;color:var(--gold);}
.pr-prev{font-size:10px;color:var(--faint);margin-left:4px;}
.return-btn{
  display:block;width:100%;padding:16px;
  background:none;color:var(--dim);border:1px solid var(--line);
  font-family:'DM Mono',monospace;font-size:11px;
  letter-spacing:3px;text-transform:uppercase;cursor:pointer;margin-top:24px;
}
.return-btn:active{color:var(--text);border-color:var(--text);}

/* ── TOAST ── */
#toast{
  position:fixed;bottom:calc(20px + var(--safe-bottom));left:20px;right:20px;
  padding:12px 16px;font-size:11px;letter-spacing:2px;text-transform:uppercase;
  opacity:0;transition:opacity 0.2s;pointer-events:none;z-index:999;
  border-left:3px solid;background:var(--surface);
}
#toast.show{opacity:1;}
</style>
</head>
<body>

<!-- LOADING -->
<div id="screen-loading" class="screen active">
  <div class="ld-eye">Strength Journal</div>
  <div class="ld-title">Atelier</div>
  <div class="ld-bar"></div>
  <div id="ld-status">Preparing</div>
</div>

<!-- CALENDAR -->
<div id="screen-calendar" class="screen">
  <div class="cal-header">
    <div class="monogram">L · W</div>
    <div class="app-title">Atelier</div>
    <div class="app-sub">Strength Journal</div>
  </div>
  <div id="today-card" class="today-card"></div>
  <div class="stats-row">
    <div class="stat-cell"><div class="stat-val" id="stat-streak">0</div><div class="stat-lbl">Streak</div></div>
    <div class="stat-cell"><div class="stat-val" id="stat-sessions">0</div><div class="stat-lbl">Sessions</div></div>
    <div class="stat-cell"><div class="stat-val" id="stat-volume">0</div><div class="stat-lbl">kg Lifted</div></div>
  </div>
  <div class="month-nav">
    <button class="mnav-btn" id="btn-prev">‹</button>
    <div class="month-lbl" id="month-lbl">—</div>
    <button class="mnav-btn" id="btn-next">›</button>
  </div>
  <div class="cal-wrap">
    <div class="dow-row">
      <div class="dow">Su</div><div class="dow">Mo</div><div class="dow">Tu</div>
      <div class="dow">We</div><div class="dow">Th</div><div class="dow">Fr</div><div class="dow">Sa</div>
    </div>
    <div class="cal-grid" id="cal-grid"></div>
  </div>
  <div class="legend">
    <div class="leg-item"><div class="leg-dot" style="background:#c9a84c"></div>Push</div>
    <div class="leg-item"><div class="leg-dot" style="background:#7fb3a8"></div>Pull</div>
    <div class="leg-item"><div class="leg-dot" style="background:#9d8bb5"></div>Tri &amp; Abs</div>
    <div class="leg-item"><div class="leg-dot" style="background:#4e4e4e"></div>Rest</div>
  </div>
</div>

<!-- WORKOUT -->
<div id="screen-workout" class="screen">
  <div class="wo-header">
    <button class="back-btn" id="btn-back">←</button>
    <div class="wo-header-text">
      <div class="wo-date-lbl" id="wo-date-lbl"></div>
      <div class="wo-session-eye">Session</div>
      <div class="wo-type" id="wo-type"></div>
    </div>
  </div>
  <div id="vol-card-wrap"></div>
  <div class="ex-groups" id="ex-groups"></div>
  <div class="finish-wrap">
    <button class="finish-btn" id="btn-finish">Complete Session</button>
  </div>
</div>

<!-- DONE -->
<div id="screen-done" class="screen">
  <div class="done-hdr">
    <div class="done-diamond">◆</div>
    <div class="done-eye">Session Complete</div>
    <div class="done-type" id="done-type"></div>
  </div>
  <div>
    <div class="done-vol" id="done-vol"></div>
    <div class="done-vol-lbl">Total Volume</div>
    <div class="done-delta" id="done-delta"></div>
  </div>
  <div id="done-pr-card"></div>
  <button class="return-btn" id="btn-return">Return to Calendar</button>
</div>

<div id="toast"></div>

<script>
// ── CONFIG ────────────────────────────────────────────────────────────────────
const SB_URL = 'https://yfxnjkackrhwkiqkajuy.supabase.co';
const SB_KEY = 'sb_publishable_3FazdVW4VOkt9NSwowu0_w_fOLE-CCK';
const SB_HDR = {
  'apikey': SB_KEY,
  'Authorization': 'Bearer ' + SB_KEY,
  'Content-Type': 'application/json',
  'Prefer': 'resolution=merge-duplicates,return=minimal'
};

const TYPE_COLOR = { push:'#c9a84c', pull:'#7fb3a8', tri:'#9d8bb5', rest:'#4e4e4e' };
const TYPE_LABEL = { push:'Push', pull:'Pull', tri:'Tri & Abs', rest:'Rest' };

const EXERCISES = {
  push:[
    {group:'Chest', items:['Incline Machine','Pec Fly','Lower Chest Cable']},
    {group:'Shoulder', items:['Lateral Raise','Back Delt']}
  ],
  pull:[
    {group:'Back', items:['Lat Pulldown','Narrow Grip Seated','T-Bar Row']},
    {group:'Bicep', items:['Peach Curl','Cross Body Hammer Curl']}
  ],
  tri:[
    {group:'Tricep', items:['Cable Rope Pushdown','Isolate Cable Pulldown']},
    {group:'Abs', items:['Tilted Seat Sit Up','Hanging Leg Raise']}
  ]
};

const PRESETS    = {'2026-05-01':'push','2026-05-02':'pull','2026-05-03':'tri'};
const CYCLE      = ['push','pull','tri','rest'];
const CYCLE_START = '2026-05-04';

// ── STATE ─────────────────────────────────────────────────────────────────────
let cache        = {};
let currentDate  = '';
let currentType  = '';
let currentAccent= '';
let calYear      = 0;
let calMonth     = 0;
let escaped      = false;

// ── UTILS ─────────────────────────────────────────────────────────────────────
function isoToday() {
  const d = new Date();
  return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
}
function p2(n){return String(n).padStart(2,'0');}

function getType(iso) {
  if (PRESETS[iso]) return PRESETS[iso];
  const diff = Math.floor((new Date(iso+'T12:00:00') - new Date(CYCLE_START+'T12:00:00')) / 86400000);
  if (diff < 0) return 'rest';
  return CYCLE[((diff % 4) + 4) % 4];
}

function exKey(name){return name.toLowerCase().replace(/\s+/g,'_').replace(/[^a-z0-9_]/g,'');}

function fmtISO(iso) {
  const d = new Date(iso+'T12:00:00');
  const M = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return M[d.getMonth()]+' '+d.getDate()+', '+d.getFullYear();
}

function fmtVol(kg){return kg>=1000?(kg/1000).toFixed(1)+'k':String(kg);}

function calcVol(sets) {
  if (!sets||typeof sets!=='object') return 0;
  let v=0;
  Object.values(sets).forEach(arr=>{
    if(!Array.isArray(arr))return;
    arr.forEach(s=>{v+=(parseFloat(s.w)||0)*(parseFloat(s.r)||0);});
  });
  return Math.round(v);
}

async function fetchTO(url, opts, ms) {
  const ctrl = new AbortController();
  const id = setTimeout(()=>ctrl.abort(), ms);
  try {
    const r = await fetch(url,{...opts, signal:ctrl.signal});
    clearTimeout(id); return r;
  } catch(e){clearTimeout(id); throw e;}
}

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}

function setStatus(t){const e=document.getElementById('ld-status');if(e)e.textContent=t;}

let toastTmr=null;
function toast(msg,color){
  color=color||'#c9a84c';
  const e=document.getElementById('toast');
  e.textContent=msg; e.style.color=color; e.style.borderLeftColor=color;
  e.classList.add('show');
  if(toastTmr)clearTimeout(toastTmr);
  toastTmr=setTimeout(()=>e.classList.remove('show'),3000);
}

// ── CACHE ─────────────────────────────────────────────────────────────────────
function loadCache(){
  try{const r=localStorage.getItem('atelier_cache');if(r)cache=JSON.parse(r);}catch(e){cache={};}
}
function saveCache(){
  try{localStorage.setItem('atelier_cache',JSON.stringify(cache));}catch(e){}
}

// ── DATABASE ──────────────────────────────────────────────────────────────────
async function dbGetAll(){
  const r = await fetchTO(SB_URL+'/rest/v1/workouts?select=*&order=iso.desc',{headers:SB_HDR},5000);
  if(!r.ok) throw new Error('HTTP '+r.status);
  const rows = await r.json();
  rows.forEach(row=>{cache[row.iso]={type:row.type,sets:row.sets||{},done:row.done,ts:row.ts};});
  saveCache();
}

async function dbUpsert(row){
  const r = await fetchTO(SB_URL+'/rest/v1/workouts',{method:'POST',headers:SB_HDR,body:JSON.stringify(row)},8000);
  if(!r.ok) throw new Error('HTTP '+r.status);
}

// ── STATS ─────────────────────────────────────────────────────────────────────
function calcStats(){
  const done = Object.entries(cache).filter(([,v])=>v.done);
  const sessions = done.length;
  let totalVol=0;
  done.forEach(([,v])=>{totalVol+=calcVol(v.sets);});

  // streak: walk backwards from today, skip rest days, stop on missed workout
  let streak=0, check=isoToday(), guard=90;
  while(guard-->0){
    const t=getType(check);
    if(t==='rest'){check=prevDay(check);continue;}
    const e=cache[check];
    if(e&&e.done){streak++;check=prevDay(check);}
    else break;
  }
  return {sessions,totalVol,streak};
}

function prevDay(iso){
  const d=new Date(iso+'T12:00:00');
  d.setDate(d.getDate()-1);
  return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
}

// ── CALENDAR ──────────────────────────────────────────────────────────────────
function renderCalendar(){
  const today=isoToday();
  const type=getType(today);
  const accent=TYPE_COLOR[type];

  // Today card
  const card=document.getElementById('today-card');
  card.style.borderLeftColor=accent;
  card.onclick=null;
  if(type==='rest'){
    card.innerHTML=`<div class="today-eye">Today</div>
      <div class="today-type" style="color:var(--dim)">Rest Day</div>
      <div class="today-date">${fmtISO(today)}</div>`;
    card.style.cursor='default';
  } else {
    card.innerHTML=`<div class="today-eye">Today</div>
      <div class="today-type" style="color:${accent}">${TYPE_LABEL[type]}</div>
      <div class="today-date">${fmtISO(today)}</div>
      <div class="today-tap" style="color:${accent}">Tap to start →</div>`;
    card.style.cursor='pointer';
    card.onclick=()=>openWorkout(today);
  }

  // Stats
  const {sessions,totalVol,streak}=calcStats();
  document.getElementById('stat-streak').textContent=streak;
  document.getElementById('stat-sessions').textContent=sessions;
  document.getElementById('stat-volume').textContent=fmtVol(totalVol);

  renderGrid(calYear,calMonth);
}

function renderGrid(yr,mo){
  const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
  document.getElementById('month-lbl').textContent=MONTHS[mo]+' '+yr;

  const grid=document.getElementById('cal-grid');
  grid.innerHTML='';
  const today=isoToday();
  const firstDay=new Date(yr,mo,1).getDay();
  const daysInMo=new Date(yr,mo+1,0).getDate();

  for(let i=0;i<firstDay;i++){
    const e=document.createElement('div');
    e.className='cal-cell'; grid.appendChild(e);
  }

  for(let d=1;d<=daysInMo;d++){
    const iso=yr+'-'+p2(mo+1)+'-'+p2(d);
    const type=getType(iso);
    const entry=cache[iso];
    const isDone=entry&&entry.done;
    const isRest=type==='rest';
    const color=TYPE_COLOR[type];

    const cell=document.createElement('div');
    cell.className='cal-cell'+(iso===today?' is-today':'')+(isDone?' is-done':'');
    if(isDone) cell.style.borderColor=color;
    if(!isRest) cell.classList.add('tappable');

    const num=document.createElement('div');
    num.className='cal-num';
    num.textContent=d;
    if(isDone) num.style.color=color;
    else if(isRest) num.style.color='var(--faint)';

    const dot=document.createElement('div');
    dot.className='cal-dot';
    dot.style.background=isRest?'transparent':color;

    cell.appendChild(num);
    cell.appendChild(dot);

    if(!isRest){
      cell.addEventListener('click',()=>openWorkout(iso));
    }
    grid.appendChild(cell);
  }
}

// ── WORKOUT ───────────────────────────────────────────────────────────────────
function openWorkout(iso){
  currentDate=iso;
  currentType=getType(iso);
  currentAccent=TYPE_COLOR[currentType];
  document.documentElement.style.setProperty('--accent',currentAccent);

  document.getElementById('wo-date-lbl').textContent=fmtISO(iso);
  const typeEl=document.getElementById('wo-type');
  typeEl.textContent=TYPE_LABEL[currentType];
  typeEl.style.color=currentAccent;

  buildVolCard();
  buildExercises();
  showScreen('screen-workout');
}

function getPrevSession(type){
  const entries=Object.entries(cache)
    .filter(([iso,v])=>v.type===type&&v.done&&iso!==currentDate)
    .sort(([a],[b])=>a<b?1:-1);
  return entries.length?entries[0][1]:null;
}

function buildVolCard(){
  const wrap=document.getElementById('vol-card-wrap');
  const prev=getPrevSession(currentType);
  if(!prev){wrap.innerHTML='';return;}

  const prevVol=calcVol(prev.sets);
  const currVol=calcVol((cache[currentDate]||{}).sets||{});
  const maxVol=Math.max(prevVol,currVol,1);
  const fillPct=Math.min(currVol/maxVol*100,100);
  const markPct=Math.min(prevVol/maxVol*100,100);

  wrap.innerHTML=`<div class="vol-card" style="border-left-color:${currentAccent}">
    <div class="vol-eye">Today's Volume</div>
    <div class="vol-today-num" style="color:${currentAccent}" id="vol-num">${currVol} <span style="font-size:16px;color:var(--dim)">kg</span></div>
    <div class="vol-bar-wrap">
      <div class="vol-bar-fill" id="vol-fill" style="width:${fillPct}%;background:${currentAccent}"></div>
      <div class="vol-bar-marker" style="left:${markPct}%"></div>
    </div>
    <div class="vol-sub">Last ${TYPE_LABEL[currentType]}: ${prevVol} kg</div>
  </div>`;
}

function refreshVolCard(){
  const numEl=document.getElementById('vol-num');
  const fillEl=document.getElementById('vol-fill');
  if(!numEl||!fillEl)return;
  const prev=getPrevSession(currentType);
  const prevVol=prev?calcVol(prev.sets):0;
  const currVol=calcVol(collectSets());
  const maxVol=Math.max(prevVol,currVol,1);
  numEl.innerHTML=currVol+' <span style="font-size:16px;color:var(--dim)">kg</span>';
  fillEl.style.width=Math.min(currVol/maxVol*100,100)+'%';
}

function buildExercises(){
  const container=document.getElementById('ex-groups');
  container.innerHTML='';
  const defs=EXERCISES[currentType]||[];
  const entry=cache[currentDate]||{};
  const prev=getPrevSession(currentType);

  defs.forEach(group=>{
    const hdr=document.createElement('div');
    hdr.className='group-hdr';
    hdr.textContent=group.group;
    container.appendChild(hdr);

    group.items.forEach(name=>{
      const key=exKey(name);
      const savedSets=(entry.sets&&entry.sets[key])||[];
      const prevSets=(prev&&prev.sets&&prev.sets[key])||[];

      const card=document.createElement('div');
      card.className='ex-card';

      const nm=document.createElement('div');
      nm.className='ex-name';
      nm.textContent=name;
      card.appendChild(nm);

      const tbl=document.createElement('table');
      tbl.className='sets-tbl';
      tbl.innerHTML=`<thead><tr>
        <th style="width:22px">#</th>
        <th style="width:70px">kg</th>
        <th style="width:24px"></th>
        <th style="width:70px">reps</th>
        <th style="text-align:right">last</th>
      </tr></thead>`;

      const tbody=document.createElement('tbody');
      const kgInputs=[];

      for(let i=0;i<3;i++){
        const sv=savedSets[i]||{};
        const pv=prevSets[i]||{};
        const last=pv.w?(pv.w+'×'+pv.r):'—';

        const tr=document.createElement('tr');
        const kgInp=makeInput('decimal',key,i,'w',sv.w||'');
        const rpInp=makeInput('numeric',key,i,'r',sv.r||'');

        tr.appendChild(td('set-num',''+(i+1)));
        tr.appendChild(tdNode(kgInp));
        tr.appendChild(td('set-x','×'));
        tr.appendChild(tdNode(rpInp));
        tr.appendChild(td('set-last',last));
        tbody.appendChild(tr);
        kgInputs.push(kgInp);
      }

      tbl.appendChild(tbody);
      card.appendChild(tbl);
      card.appendChild(divider());
      container.appendChild(card);

      // auto-fill set 1 kg → sets 2 & 3 (debounced)
      let afTimer=null;
      kgInputs[0].addEventListener('input',()=>{
        checkPR(kgInputs[0],key);
        refreshVolCard();
        clearTimeout(afTimer);
        afTimer=setTimeout(()=>{
          const v=kgInputs[0].value.trim();
          if(!v)return;
          if(!kgInputs[1].value){kgInputs[1].value=v;checkPR(kgInputs[1],key);}
          if(!kgInputs[2].value){kgInputs[2].value=v;checkPR(kgInputs[2],key);}
          refreshVolCard();
        },700);
      });
      kgInputs[1].addEventListener('input',()=>{checkPR(kgInputs[1],key);refreshVolCard();});
      kgInputs[2].addEventListener('input',()=>{checkPR(kgInputs[2],key);refreshVolCard();});
    });
  });
}

function makeInput(mode,key,i,field,val){
  const inp=document.createElement('input');
  inp.className='set-input';
  inp.type='number';
  inp.inputMode=mode;
  inp.placeholder=field==='w'?'kg':'reps';
  inp.dataset.key=key;
  inp.dataset.set=i;
  inp.dataset.field=field;
  inp.value=val;
  return inp;
}
function td(cls,txt){const e=document.createElement('td');e.className=cls;e.textContent=txt;return e;}
function tdNode(node){const e=document.createElement('td');e.appendChild(node);return e;}
function divider(){const e=document.createElement('div');e.className='sets-divider';return e;}

function getBest(key){
  let best=0;
  Object.entries(cache).forEach(([iso,e])=>{
    if(iso===currentDate)return;
    if(!e.sets||!e.sets[key])return;
    e.sets[key].forEach(s=>{const w=parseFloat(s.w)||0;if(w>best)best=w;});
  });
  return best;
}

function checkPR(inp,key){
  const v=parseFloat(inp.value);
  if(!v){inp.classList.remove('pr');return;}
  inp.classList.toggle('pr',v>getBest(key));
}

function collectSets(){
  const sets={};
  document.querySelectorAll('.set-input').forEach(inp=>{
    const k=inp.dataset.key,i=parseInt(inp.dataset.set),f=inp.dataset.field;
    if(!sets[k])sets[k]=[{},{},{}];
    sets[k][i][f]=inp.value;
  });
  return sets;
}

// ── DONE ──────────────────────────────────────────────────────────────────────
function detectPRs(sets){
  const prs=[];
  Object.entries(sets).forEach(([key,arr])=>{
    let maxW=0;
    arr.forEach(s=>{const w=parseFloat(s.w)||0;if(w>maxW)maxW=w;});
    if(!maxW)return;
    const prev=getBest(key);
    if(maxW>prev){
      let dispName=key;
      Object.values(EXERCISES).forEach(groups=>{
        groups.forEach(g=>{g.items.forEach(n=>{if(exKey(n)===key)dispName=n;});});
      });
      prs.push({name:dispName,w:maxW,prev});
    }
  });
  return prs;
}

function openDone(row,prevRow){
  const accent=TYPE_COLOR[row.type];
  const vol=calcVol(row.sets);
  const prevVol=prevRow?calcVol(prevRow.sets):null;

  document.getElementById('done-type').textContent=TYPE_LABEL[row.type];
  document.getElementById('done-type').style.color=accent;
  document.getElementById('done-vol').textContent=vol+' kg';
  document.getElementById('done-vol').style.color=accent;

  const dEl=document.getElementById('done-delta');
  if(prevVol!==null&&prevVol>0){
    const diff=vol-prevVol;
    const pct=((diff/prevVol)*100).toFixed(1);
    dEl.textContent=(diff>=0?'▲ ':'▼ ')+Math.abs(diff)+' kg ('+(diff>=0?'+':'')+pct+'%) vs last';
    dEl.className='done-delta '+(diff>=0?'up':'dn');
  } else {
    dEl.textContent='First session of this type';
    dEl.className='done-delta';
  }

  const prs=detectPRs(row.sets);
  const prCard=document.getElementById('done-pr-card');
  if(prs.length){
    prCard.innerHTML=`<div class="pr-card">
      <div class="pr-eye">Personal Records</div>
      ${prs.map(p=>`<div class="pr-row">
        <span class="pr-name">${p.name}</span>
        <span><span class="pr-val">${p.w} kg</span>${p.prev>0?`<span class="pr-prev">(was ${p.prev} kg)</span>`:''}</span>
      </div>`).join('')}
    </div>`;
  } else {
    prCard.innerHTML='';
  }

  showScreen('screen-done');
}

// ── FINISH ────────────────────────────────────────────────────────────────────
async function handleFinish(){
  const sets=collectSets();
  const prev=getPrevSession(currentType);
  const row={iso:currentDate,type:currentType,sets,done:true,ts:Date.now()};

  cache[currentDate]={type:currentType,sets,done:true,ts:row.ts};
  saveCache();
  openDone(row,prev);

  try{
    await dbUpsert(row);
    toast('Saved ✓','#c9a84c');
  } catch(e){
    toast('Save failed — will retry','#c87b6e');
  }
}

// ── INIT ──────────────────────────────────────────────────────────────────────
async function init(){
  setStatus('Preparing');
  const d=new Date();
  calYear=d.getFullYear(); calMonth=d.getMonth();

  const escape=setTimeout(()=>{
    if(escaped)return; escaped=true;
    toast('Offline — using cache','#c9a84c');
    renderCalendar(); showScreen('screen-calendar');
  },7000);

  try{
    loadCache();
    setStatus('Reading cache');
    renderCalendar();
    setStatus('Connecting');
    await dbGetAll();
    setStatus('Synced');
    renderCalendar();
    clearTimeout(escape);
    if(!escaped) showScreen('screen-calendar');
  } catch(e){
    clearTimeout(escape);
    if(!escaped){
      escaped=true;
      toast('Offline — using cache','#c9a84c');
      renderCalendar(); showScreen('screen-calendar');
    }
  }
}

// ── EVENTS ────────────────────────────────────────────────────────────────────
document.getElementById('btn-back').addEventListener('click',()=>{renderCalendar();showScreen('screen-calendar');});
document.getElementById('btn-finish').addEventListener('click',handleFinish);
document.getElementById('btn-return').addEventListener('click',()=>{renderCalendar();showScreen('screen-calendar');});
document.getElementById('btn-prev').addEventListener('click',()=>{calMonth--;if(calMonth<0){calMonth=11;calYear--;}renderGrid(calYear,calMonth);});
document.getElementById('btn-next').addEventListener('click',()=>{calMonth++;if(calMonth>11){calMonth=0;calYear++;}renderGrid(calYear,calMonth);});

let swipeX=0;
document.getElementById('screen-calendar').addEventListener('touchstart',e=>{swipeX=e.touches[0].clientX;},{passive:true});
document.getElementById('screen-calendar').addEventListener('touchend',e=>{
  const dx=swipeX-e.changedTouches[0].clientX;
  if(Math.abs(dx)<60)return;
  if(dx>0){calMonth++;if(calMonth>11){calMonth=0;calYear++;}}
  else{calMonth--;if(calMonth<0){calMonth=11;calYear--;}}
  renderGrid(calYear,calMonth);
},{passive:true});

init();
</script>
